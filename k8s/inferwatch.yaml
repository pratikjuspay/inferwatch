# inferwatch — self-hosted k8s (minikube/kind)
# Apply order matters via kubectl one-liner in K8S.md.
apiVersion: v1
kind: Namespace
metadata:
  name: inferwatch
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: inferwatch
data:
  LLM_PROVIDER: "gemini"
  GEMINI_MODEL: "gemini-3.1-flash-lite"
  OPENAI_MODEL: "gpt-4o-mini"
  RUST_LOG: "info,backend=info"
  DATABASE_URL: "postgres://postgres:postgres@postgres:5432/inferwatch"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: inferwatch
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: inferwatch
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              value: "postgres" # demo-grade; production → k8s Secret
            - name: POSTGRES_DB
              value: "inferwatch"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "inferwatch"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: inferwatch
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: inferwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: inferwatch-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: gemini-api-key
                  optional: true # openai-only deployments may omit it
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: llm-secrets
                  key: openai-api-key
                  optional: true
          ports:
            - containerPort: 3001
          # backend refuses to start until it can connect + migrate — crashloop is the health signal
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 10
      # backend needs postgres healthy and provider key present
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - until pg_isready -h postgres -p 5432 -U postgres -d inferwatch; do echo waiting for db; sleep 2; done
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: inferwatch
spec:
  selector:
    app: backend
  ports:
    - port: 3001
      targetPort: 3001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: inferwatch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: inferwatch-frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "5173"
          ports:
            - containerPort: 5173
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: inferwatch
spec:
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
