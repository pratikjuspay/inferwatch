services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inferwatch
    ports:
      # Host default 5433 so a locally-running Postgres (5432) never clashes.
      # Only for humans peeking at the DB — backend reaches db:5432 internally.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inferwatch"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The backend applies its own migrations on startup (sqlx::migrate!),
  # so no separate migration step is needed.
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/inferwatch
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?set GEMINI_API_KEY in your shell or a root .env file}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.1-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      RUST_LOG: info,backend=info
    ports:
      # Pinned: the frontend image bakes http://localhost:3001 at build time.
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      PORT: 5173
      ORIGIN: http://localhost:5173
    ports:
      # Safe to move: FRONTEND_PORT=8080 docker compose up
      # (browser talks straight to the backend; CORS is open)
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  pgdata:
